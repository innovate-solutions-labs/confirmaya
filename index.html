<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConfirmaYa</title>
<style>
:root{--bg:#eaf6fb;--card:#fff;--ink:#0b1a33;--mute:#5b6b82;--line:#d5e5ef;--brand:#0891b2;--brand-ink:#fff;
--grad:linear-gradient(135deg,#06b6d4 0%,#2563eb 100%);--navy:#001030;--navy2:#00305a;--cyan:#30f0f0;--mint:#70f0c0;
--ok:#0f7a4f;--okbg:#d3f9e6;--warn:#9a5b00;--warnbg:#fff0c9;--bad:#c2261f;--badbg:#ffe1df;--gray:#4b5563;--graybg:#e6edf3}
@media (prefers-color-scheme:dark){:root{--bg:#050d1f;--card:#0c1a33;--ink:#e6f4ff;--mute:#8fa6c2;--line:#1b3358;--brand:#22d3ee;--brand-ink:#001030;
--ok:#6dffb0;--okbg:#0e3a2a;--warn:#fbbf24;--warnbg:#3a2d0a;--bad:#ff8a84;--badbg:#42191a;--gray:#aab9cc;--graybg:#15284a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));border-bottom:2px solid var(--cyan);box-shadow:0 4px 18px rgba(48,240,240,.25);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;color:#fff}
header h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:0 0 14px rgba(48,240,240,.6)}
header h1 em{font-style:normal;color:var(--cyan)}
header .mute{color:#a9c4e2}header select{background:#0a2349;color:#fff;border-color:#27507f}
header .b{background:transparent;color:#fff;border-color:#27507f}
main{max-width:920px;width:100%;margin:0 auto;padding:16px;flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
nav button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,48,90,.06)}
footer{background:var(--navy);color:#a9c4e2;text-align:center;padding:16px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;border-top:1px solid #0d3a66}
footer img{width:34px;height:34px;border-radius:8px}
footer b{color:var(--cyan)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
h2{font-size:16px;margin:0 0 8px}
.mute{color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;text-decoration:none;display:inline-block}
.b.p{background:var(--grad);color:#fff;border-color:transparent}
.b.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.b.d{color:var(--bad)}
.b:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.s-por_confirmar,.s-pendiente{background:var(--warnbg);color:var(--warn)}.s-confirmado,.s-enviado{background:#dbeafe;color:#1d4ed8}
.s-entregado,.s-active,.s-cortesia{background:var(--okbg);color:var(--ok)}.s-devuelto,.s-cancelado,.s-canceled,.s-past_due{background:var(--badbg);color:var(--bad)}
.r-verde{background:var(--okbg);color:var(--ok)}.r-amarillo{background:var(--warnbg);color:var(--warn)}.r-rojo{background:var(--badbg);color:var(--bad)}.r-sin{background:var(--graybg);color:var(--gray)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid #22d3ee;border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.kpi span{font-size:12px;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.alert{border-radius:8px;padding:9px 11px;margin-top:10px;font-size:14px}
.alert.rojo{background:var(--badbg);color:var(--bad)}.alert.amarillo{background:var(--warnbg);color:var(--warn)}.alert.info{background:#dbeafe;color:#1d4ed8}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.demo{background:var(--warnbg);color:var(--warn);padding:6px 16px;font-size:13px;text-align:center}
.auth{max-width:420px;margin:24px auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
details summary{cursor:pointer}
@media(max-width:560px){main{padding:12px}}
</style>
</head>

<script>
/* ConfirmaYa - lógica pura (sin pantalla). Se usa en el navegador y en las pruebas de Node. */
(function (root) {
  'use strict';

  /* ---------- Lectura del mensaje que llega por Releasit ---------- */
  function parseMoney(raw) {
    if (!raw) return null;
    var s = String(raw).replace(/[^\d.,]/g, '').replace(/^[.,]+|[.,]+$/g, '');
    if (!s) return null;
    var lastC = s.lastIndexOf(','), lastD = s.lastIndexOf('.');
    if (lastC > -1 && lastD > -1) {
      // el último separador es el decimal
      var dec = Math.max(lastC, lastD);
      s = s.slice(0, dec).replace(/[.,]/g, '') + '.' + s.slice(dec + 1);
    } else if (lastC > -1) {
      s = (s.length - lastC - 1 === 2) ? s.replace(',', '.') : s.replace(/,/g, '');
    }
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  function clean(s) {
    return (s || '').replace(/\s+/g, ' ').replace(/^[\s,.;:]+|[\s,.;:]+$/g, '').trim();
  }

  function parseOrderMessage(text) {
    var t = String(text || '').replace(/\r/g, '');
    var missing = [];
    var d = { qty: 1, product: '', total: null, name: '', province: '', city: '', address: '' };

    var m = t.match(/acabo de comprar\s+([\s\S]+?)\s*,\s*con un total de\s*:?\s*([^\n]*)/i);
    if (m) {
      var prod = clean(m[1]);
      var q = prod.match(/^(\d+)\s+(.+)$/);
      if (q) { d.qty = parseInt(q[1], 10); d.product = clean(q[2]); } else { d.product = prod; }
      d.total = parseMoney(m[2]);
    }
    var n = t.match(/mi nombre es\s+([^\n]+)/i);
    if (n) d.name = clean(n[1]);

    var p = t.match(/Provincia\s*:\s*([^\n]*)/i);
    if (p) d.province = clean(p[1]);
    var c = t.match(/Ciudad\s*:\s*([^\n]*)/i);
    if (c) d.city = clean(c[1]);
    var a = t.match(/Direcci[oó]n\s*:\s*([\s\S]*?)(?:¿\s*Deseas|RESPONDER|$)/i);
    if (a) d.address = clean(a[1].split('\n').map(clean).filter(Boolean).join(', '));

    // si Releasit no reemplazó una variable, queda tipo {city}
    ['product', 'name', 'province', 'city', 'address'].forEach(function (k) {
      if (/\{[a-z_0-9]+\}/i.test(d[k])) d[k] = '';
    });

    if (!d.product) missing.push('producto');
    if (d.total == null) missing.push('total');
    if (!d.name) missing.push('nombre');
    if (!d.city) missing.push('ciudad');
    if (!d.address) missing.push('dirección');
    return { ok: missing.length === 0, data: d, missing: missing };
  }

  /* ---------- Pedido que llega directo de Shopify (webhook orders/create) ---------- */
  function fromShopifyOrder(o) {
    o = o || {};
    var sa = o.shipping_address || {}, ba = o.billing_address || {}, cu = o.customer || {};
    var items = Array.isArray(o.line_items) ? o.line_items : [];
    var qty = items.reduce(function (a, i) { return a + (Number(i.quantity) || 0); }, 0) || 1;
    var product = items.map(function (i) { return clean(i.title); }).filter(Boolean).join(' + ');
    var name = clean([sa.first_name || ba.first_name || cu.first_name, sa.last_name || ba.last_name || cu.last_name].filter(Boolean).join(' '));
    var phone = sa.phone || o.phone || cu.phone || ba.phone || '';
    var gateways = (o.payment_gateway_names || []).join(' ') + ' ' + (o.gateway || '');
    var d = {
      shopifyId: o.id != null ? String(o.id) : '',
      number: o.name || '',
      created: o.created_at ? Date.parse(o.created_at) || Date.now() : Date.now(),
      qty: qty, product: product, total: parseMoney(o.total_price),
      name: name, phone: phone,
      province: clean(sa.province || ba.province), city: clean(sa.city || ba.city),
      address: clean([sa.address1 || ba.address1, sa.address2 || ba.address2].filter(Boolean).join(', ')),
      email: o.email || cu.email || '',
      cod: /cash on delivery|contra\s?entrega|\bcod\b/i.test(gateways),
      cancelled: !!o.cancelled_at
    };
    var missing = [];
    if (!d.shopifyId) missing.push('id');
    if (!d.product) missing.push('producto');
    if (d.total == null) missing.push('total');
    if (!d.name) missing.push('nombre');
    if (!validEcPhone(d.phone)) missing.push('teléfono');
    if (!d.city) missing.push('ciudad');
    if (!d.address) missing.push('dirección');
    return { ok: missing.length === 0, data: d, missing: missing };
  }

  /* ---------- Teléfonos de Ecuador y enlace de WhatsApp ---------- */
  function normalizePhone(raw) {
    var s = String(raw || '').replace(/\D/g, '');
    if (!s) return '';
    if (s.indexOf('00593') === 0) s = s.slice(2);
    if (s.indexOf('593') === 0) return s;
    if (s.charAt(0) === '0') s = s.slice(1);
    return '593' + s;
  }
  function validEcPhone(raw) {
    return /^593\d{8,9}$/.test(normalizePhone(raw));
  }
  function waLink(phone, text) {
    return 'https://wa.me/' + normalizePhone(phone) + '?text=' + encodeURIComponent(text);
  }

  /* ---------- Semáforo de riesgo del comprador ---------- */
  // h = { delivered, returned } (del historial que muestra Dropi o del historial propio)
  function riskLevel(h) {
    var del = Number(h && h.delivered) || 0;
    var ret = Number(h && h.returned) || 0;
    var total = del + ret;
    if (total < 3) return { level: 'sin', label: 'Sin historial', total: total, rate: null };
    var rate = ret / total;
    var level = rate <= 0.15 ? 'verde' : rate <= 0.35 ? 'amarillo' : 'rojo';
    var label = { verde: 'Buen comprador', amarillo: 'Riesgo medio', rojo: 'Riesgo alto' }[level];
    return { level: level, label: label, total: total, rate: rate };
  }

  /* ---------- Mensajes de WhatsApp ---------- */
  var DEFAULT_TEMPLATES = {
    confirmar: 'Hola {nombre} 👋 Soy de {tienda}. Recibimos tu pedido de {producto} por {total}. ¿Nos confirmas que tus datos están bien?\n\nEnvío a: {direccion}, {ciudad}.\n\nResponde "SI, CONFIRMO" para despacharlo 📦',
    recordatorio: 'Hola {nombre}, te escribimos de {tienda}. Tu pedido de {producto} sigue pendiente de confirmación. ¿Lo confirmamos para enviártelo? Responde "SI, CONFIRMO" 🙌',
    adelanto: 'Hola {nombre}, soy de {tienda}. Para enviar tu pedido de {producto} necesitamos que cubras el costo del envío por adelantado ({adelanto}). Se descuenta del total y así garantizamos tu entrega. ¿Te enviamos los datos para el pago?',
    enviado: 'Hola {nombre} 🚚 Tu pedido de {producto} ya salió. Número de guía: {guia}. Llegará en 1 a 5 días hábiles. Te pedimos estar atento al teléfono para recibirlo y tener {total} listo.',
    entrega: 'Hola {nombre}, hoy llega tu pedido de {producto}. Por favor ten listo {total} y estate atento al teléfono 📞 ¡Gracias por tu compra!',
    carrito: 'Hola {nombre} 👋 Soy de {tienda}. Vimos que dejaste pendiente tu pedido de {producto} ({total}). ¿Te quedó alguna duda o te ayudamos a terminarlo? Aquí puedes completarlo: {enlace}'
  };

  function money(n) {
    return '$' + (Number(n) || 0).toFixed(2);
  }
  function fillTemplate(tpl, order, store) {
    var map = {
      nombre: (order.name || '').split(' ')[0] || 'cliente',
      tienda: (store && store.name) || 'la tienda',
      producto: (order.qty > 1 ? order.qty + ' ' : '') + order.product,
      total: money(order.total),
      direccion: order.address || '',
      ciudad: order.city || '',
      guia: order.guide || '(pendiente)',
      adelanto: money((store && store.advance) != null ? store.advance : 8),
      enlace: order.recoverUrl || ''
    };
    return String(tpl).replace(/\{(\w+)\}/g, function (all, k) { return k in map ? map[k] : all; });
  }

  /* ---------- Reportes ---------- */
  var STATES = ['por_confirmar', 'confirmado', 'subido', 'enviado', 'entregado', 'devuelto', 'cancelado'];
  function summarize(orders) {
    var r = { total: orders.length, confirmados: 0, entregados: 0, devueltos: 0, cancelados: 0,
              enCamino: 0, ventas: 0, riesgoAlto: 0, adelantos: 0 };
    orders.forEach(function (o) {
      if (o.status !== 'por_confirmar' && o.status !== 'cancelado') r.confirmados++;
      if (o.status === 'entregado') { r.entregados++; r.ventas += Number(o.total) || 0; }
      if (o.status === 'devuelto') r.devueltos++;
      if (o.status === 'cancelado') r.cancelados++;
      if (o.status === 'subido' || o.status === 'enviado') r.enCamino++;
      if (o.advanceAsked) r.adelantos++;
      if (riskLevel(o.history).level === 'rojo') r.riesgoAlto++;
    });
    var cerrados = r.entregados + r.devueltos;
    r.tasaEntrega = cerrados ? r.entregados / cerrados : null;
    r.tasaConfirmacion = r.total ? r.confirmados / r.total : null;
    return r;
  }

  var api = {
    parseOrderMessage: parseOrderMessage, parseMoney: parseMoney, fromShopifyOrder: fromShopifyOrder,
    normalizePhone: normalizePhone, validEcPhone: validEcPhone, waLink: waLink,
    riskLevel: riskLevel, DEFAULT_TEMPLATES: DEFAULT_TEMPLATES, fillTemplate: fillTemplate,
    money: money, summarize: summarize, STATES: STATES
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ConfirmaCore = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){

var KEY = 'confirmaya_demo_v2';
var $ = function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,10)}
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function pct(x){return x==null?'—':Math.round(x*100)+'%'}
var toastTimer;

function client(id){return S.clients.find(function(c){return c.id===id})}
function currentClient(){return S.isAdmin?(S.viewAs?client(S.viewAs):null):S.clients[0]||null}
function ordersOf(id){return S.orders.filter(function(o){return o.clientId===id}).sort(function(a,b){return b.created-a.created})}
function tplOf(c,k){return (c.templates&&c.templates[k])||C.DEFAULT_TEMPLATES[k]}
function hasAccess(c){return !!c&&ACCESS.indexOf(c.subStatus)>-1}

/* Historial del comprador: lo que anotó el cliente de Dropi o, si no, el de su propia tienda */
function historyFor(o){
  var h=o.history||{};
  if((Number(h.delivered)||0)+(Number(h.returned)||0)>0) return h;
  var own={delivered:0,returned:0}, p=C.normalizePhone(o.phone);
  if(!p) return own;
  S.orders.forEach(function(x){
    if(x.id!==o.id&&x.clientId===o.clientId&&C.normalizePhone(x.phone)===p){
      if(x.status==='entregado')own.delivered++; if(x.status==='devuelto')own.returned++;
    }
  });
  return own;
}

/* ---------- Capa de datos ---------- */
var api;
function dbToClient(r){return {id:r.id,name:r.name,store:r.store,phone:r.phone||'',email:r.email||'',price:Number(r.price)||0,advance:Number(r.advance),templates:r.templates||{},subStatus:r.sub_status,periodEnd:r.current_period_end,userId:r.user_id}}
function dbToOrder(r){return {id:r.id,clientId:r.client_id,created:Date.parse(r.created_at),status:r.status,qty:r.qty,product:r.product,total:Number(r.total),name:r.name,phone:r.phone||'',province:r.province||'',city:r.city||'',address:r.address||'',guide:r.guide||'',number:r.number||'',history:{delivered:r.hist_delivered,returned:r.hist_returned},advanceAsked:!!r.advance_asked}}
function dbToCheckout(r){return {id:r.id,clientId:r.client_id,created:Date.parse(r.updated_at||r.created_at),name:r.name||'',phone:r.phone||'',product:r.product||'',total:Number(r.total)||0,recoverUrl:r.recover_url||'',status:r.status}}

function realApi(){
  var sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  function fail(e){if(e&&e.error){throw new Error(e.error.message||'Error')}return e}
  async function fn(body){
    var s=(await sb.auth.getSession()).data.session;
    var r=await fetch(CFG.url+'/functions/v1/admin-clients',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':CFG.key},body:JSON.stringify(body)});
    var j=await r.json().catch(function(){return {}});
    if(!r.ok) throw new Error(j.error||('Error '+r.status));
    return j;
  }
  return {
    sb:sb,
    onAuth:function(cb){sb.auth.onAuthStateChange(function(ev){cb(ev)})},
    login:async function(email,pw){var r=await sb.auth.signInWithPassword({email:email,password:pw});if(r.error)throw new Error('Correo o contraseña incorrectos');},
    logout:async function(){await sb.auth.signOut()},
    setPassword:async function(pw){fail(await sb.auth.updateUser({password:pw}))},
    load:async function(){
      var s=(await sb.auth.getSession()).data.session;
      S.session=s; if(!s){S.clients=[];S.orders=[];S.checkouts=[];S.payments=[];return}
      S.isAdmin=(await sb.rpc('is_admin')).data===true;
      var cl=fail(await sb.from('clients').select('*')); S.clients=(cl.data||[]).map(dbToClient);
      var cur=S.isAdmin?null:S.clients[0];
      if(S.isAdmin||hasAccess(cur)){
        var o=fail(await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(2000)); S.orders=(o.data||[]).map(dbToOrder);
        var k=fail(await sb.from('checkouts').select('*').in('status',['abierto','contactado']).order('updated_at',{ascending:false}).limit(500)); S.checkouts=(k.data||[]).map(dbToCheckout);
        if(S.isAdmin){var p=fail(await sb.from('payments').select('*')); S.payments=p.data||[]}
      }else{S.orders=[];S.checkouts=[]}
    },
    updateOrder:async function(id,patch){var m={};
      if('status' in patch)m.status=patch.status; if('guide' in patch)m.guide=patch.guide; if('phone' in patch)m.phone=patch.phone;
      if('history' in patch){m.hist_delivered=patch.history.delivered||0;m.hist_returned=patch.history.returned||0}
      if('advanceAsked' in patch)m.advance_asked=patch.advanceAsked;
      fail(await sb.from('orders').update(m).eq('id',id))},
    addOrder:async function(cid,d,phone){fail(await sb.from('orders').insert({client_id:cid,source:'manual',qty:d.qty,product:d.product,total:d.total,name:d.name,phone:phone,province:d.province,city:d.city,address:d.address}))},
    saveSettings:async function(c){fail(await sb.rpc('update_my_settings',{p_advance:c.advance,p_templates:c.templates}))},
    setCheckout:async function(id,status){fail(await sb.from('checkouts').update({status:status}).eq('id',id))},
    setSubStatus:async function(cid,st){fail(await sb.from('clients').update({sub_status:st}).eq('id',cid))},
    setPrice:async function(cid,price){fail(await sb.from('clients').update({price:price}).eq('id',cid))},
    setPaid:async function(cid,month,paid,amount){fail(await sb.from('payments').upsert({client_id:cid,month:month,paid:paid,amount:amount}))},
    admin:fn
  };
}

    updateOrder:async function(){save()}, addOrder:async function(cid,r,phone){var x=r;S.orders.push({id:uid(),clientId:cid,created:Date.now(),status:'por_confirmar',qty:x.qty,product:x.product,total:x.total,name:x.name,phone:phone,province:x.province,city:x.city,address:x.address,guide:'',number:'',history:{},advanceAsked:false});save()},
    saveSettings:async function(){save()}, setCheckout:async function(){save()}, setSubStatus:async function(){save()}, setPrice:async function(){save()},

function render(){

function supportBtn(){var n=CFG.supportWhatsapp||'';return n?'<a class="b p" target="_blank" rel="noopener" href="'+esc(C.waLink(n,'Hola, necesito ayuda con ConfirmaYa'))+'">Escribir por WhatsApp</a>':''}

function renderBlocked(c){

/* ===== CLIENTE ===== */
var FILTERS=[['por_confirmar','Por confirmar'],['confirmado','Confirmados'],['enviado','Enviados'],['cerrados','Cerrados'],['todos','Todos']];
function renderClient(c){
  var tab=S.tab.client;
  var nCart=S.checkouts.filter(function(k){return k.clientId===c.id&&k.status==='abierto'}).length;
  nav([['pedidos','Pedidos'],['carritos','Carritos'+(nCart?' ('+nCart+')':'')],['nuevo','Nuevo pedido'],['reporte','Reporte'],['mensajes','Mis mensajes']],tab,'client');
  var h=(S.isAdmin?'<div class="alert info">Estás viendo el panel como <b>'+esc(c.name)+'</b> ('+esc(statusLabelSub(c.subStatus))+').</div>':'')
   +(c.subStatus==='past_due'?'<div class="alert amarillo">Tu último pago no se pudo cobrar. Actualiza tu método de pago para no perder el acceso.'+(CFG.whopUrl?' <a href="'+esc(CFG.whopUrl)+'" target="_blank" rel="noopener">Ir a pagar</a>':'')+'</div>':'');
  if(tab==='pedidos')h+=viewOrders(c);else if(tab==='carritos')h+=viewCarts(c);else if(tab==='nuevo')h+=viewNew(c);else if(tab==='reporte')h+=viewReport(c);else h+=viewTemplates(c);
  $('#view').innerHTML=h;
}
function statusLabelSub(s){return {pendiente:'Pendiente de pago',active:'Activo',past_due:'Pago atrasado',canceled:'Cancelado',cortesia:'Cortesía'}[s]||s}
function statusLabel(s){return {por_confirmar:'Por confirmar',confirmado:'Confirmado',enviado:'Enviado',entregado:'Entregado',devuelto:'Devuelto',cancelado:'Cancelado'}[s]||s}

function viewOrders(c){
  var all=ordersOf(c.id), f=S.filter;
  var list=all.filter(function(o){if(f==='todos')return true;if(f==='cerrados')return ['entregado','devuelto','cancelado'].indexOf(o.status)>-1;return o.status===f});
  var pend=all.filter(function(o){return o.status==='por_confirmar'}).length;
  var h='<div class="card"><b>'+esc(c.store)+'</b><div class="mute">'+(pend?pend+' pedido(s) esperando confirmación':'Nada pendiente por confirmar 🎉')+'</div>'
   +'<div class="actions">'+FILTERS.map(function(x){return '<button class="b '+(f===x[0]?'p':'')+'" data-act="filter" data-f="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div></div>';
  if(!list.length)h+='<div class="card mute">No hay pedidos aquí.</div>';
  return h+list.map(function(o){return orderCard(o,c)}).join('');
}
function orderCard(o,c){
  var hist=historyFor(o),risk=C.riskLevel(hist),store={name:c.store,advance:c.advance},phoneOk=C.validEcPhone(o.phone);
  function wa(k){return phoneOk?C.waLink(o.phone,C.fillTemplate(tplOf(c,k),o,store)):'#'}
  function waBtn(k,label,cls){return '<a class="b '+(cls||'')+'" href="'+esc(wa(k))+'" target="_blank" rel="noopener" data-act="wa" data-id="'+esc(o.id)+'" data-k="'+k+'">'+label+'</a>'}
  var early=['por_confirmar','confirmado'].indexOf(o.status)>-1;
  var h='<div class="card"><div class="row"><div class="grow"><b>'+esc(o.name)+'</b> · '+esc(o.qty>1?o.qty+' × ':'')+esc(o.product)+'<div class="mute">'+esc(o.city)+' · '+esc(C.money(o.total))+' · '+esc(o.phone||'sin teléfono')+' · '+new Date(o.created).toLocaleDateString('es-EC')+(o.guide?' · guía '+esc(o.guide):'')+'</div></div>'
   +'<span class="badge s-'+o.status+'">'+esc(statusLabel(o.status))+'</span><span class="badge r-'+risk.level+'">'+esc(risk.label)+(risk.rate!=null?' ('+Math.round(risk.rate*100)+'% devol.)':'')+'</span></div>';
  if(!phoneOk)h+='<div class="err">Falta un teléfono válido para abrir WhatsApp. Corrígelo abajo.</div>';
  if(early&&risk.level==='rojo')h+='<div class="alert rojo"><b>Comprador de alto riesgo.</b> Devuelve muchos pedidos. Pídele que adelante el envío ('+esc(C.money(c.advance))+') antes de despachar.</div>';
  else if(early&&risk.level==='amarillo')h+='<div class="alert amarillo"><b>Riesgo medio.</b> Confirma bien la dirección antes de enviar.</div>';
  h+='<div class="actions">';
  if(o.status==='por_confirmar'){
    h+=waBtn('confirmar','💬 Enviar confirmación','p')+waBtn('recordatorio','⏰ Recordatorio')+(risk.level==='rojo'||risk.level==='amarillo'?waBtn('adelanto','💵 Pedir adelanto'):'')
     +'<button class="b g" data-act="status" data-id="'+o.id+'" data-s="confirmado">✓ Ya confirmó</button><button class="b d" data-act="status" data-id="'+o.id+'" data-s="cancelado">Cancelar</button>';
  }else if(o.status==='confirmado'){
    h+='<span class="mute">Esperando que Dropi genere la guía (el estado cambia solo).</span><button class="b" data-act="status" data-id="'+o.id+'" data-s="enviado">Marcar enviado</button><button class="b d" data-act="status" data-id="'+o.id+'" data-s="cancelado">Cancelar</button>';
  }else if(o.status==='enviado'){
    h+=waBtn('enviado','🚚 Avisar que salió')+waBtn('entrega','📞 Aviso de entrega')+'<button class="b g" data-act="status" data-id="'+o.id+'" data-s="entregado">Entregado</button><button class="b d" data-act="status" data-id="'+o.id+'" data-s="devuelto">Devuelto</button>';
  }
  h+='</div>';
  if(early)h+='<details style="margin-top:10px"><summary class="mute">Historial del comprador en Dropi y teléfono</summary><div class="row">'
   +'<div><label>Teléfono</label><input data-act="phone" data-id="'+o.id+'" value="'+esc(o.phone)+'" placeholder="09XXXXXXXX"></div>'
   +'<div><label>Entregados</label><input type="number" min="0" data-act="hist" data-w="delivered" data-id="'+o.id+'" value="'+esc((o.history||{}).delivered||'')+'"></div>'
   +'<div><label>Devueltos</label><input type="number" min="0" data-act="hist" data-w="returned" data-id="'+o.id+'" value="'+esc((o.history||{}).returned||'')+'"></div></div>'
   +'<div class="mute" style="margin-top:6px">Mira el historial del comprador en Dropi y anota los números. Si lo dejas vacío, se usa el historial de tu propia tienda.</div></details>';
  return h+'</div>';
}

function viewCarts(c){
  var list=S.checkouts.filter(function(k){return k.clientId===c.id}).sort(function(a,b){return b.created-a.created});
  var h='<div class="card"><h2>Carritos abandonados</h2><div class="mute">Personas que empezaron a comprar y dejaron su número, pero no terminaron. Un mensaje a tiempo recupera ventas.</div></div>';
  if(!list.length)return h+'<div class="card mute">No hay carritos pendientes.</div>';
  var store={name:c.store,advance:c.advance};
  return h+list.map(function(k){
    var ok=C.validEcPhone(k.phone), o={name:k.name,product:k.product,qty:1,total:k.total,recoverUrl:k.recoverUrl};
    var link=ok?C.waLink(k.phone,C.fillTemplate(tplOf(c,'carrito'),o,store)):'#';
    return '<div class="card"><div class="row"><div class="grow"><b>'+esc(k.name||'Sin nombre')+'</b> · '+esc(k.product||'(sin producto)')+'<div class="mute">'+esc(C.money(k.total))+' · '+esc(k.phone)+' · '+new Date(k.created).toLocaleString('es-EC')+'</div></div>'
     +'<span class="badge s-'+(k.status==='contactado'?'confirmado':'por_confirmar')+'">'+(k.status==='contactado'?'Contactado':'Pendiente')+'</span></div>'
     +'<div class="actions"><a class="b p" href="'+esc(link)+'" target="_blank" rel="noopener" data-act="cartwa" data-id="'+esc(k.id)+'">💬 Escribirle</a>'
     +'<button class="b" data-act="cart" data-id="'+k.id+'" data-s="descartado">Descartar</button></div></div>';
  }).join('');
}

function viewNew(c){
  return '<div class="card"><h2>Nuevo pedido a mano</h2><div class="mute">Los pedidos de tu tienda llegan solos. Usa esto solo si un pedido no apareció: pega el mensaje de WhatsApp.</div>'
   +'<label>Mensaje del pedido</label><textarea id="msg" placeholder="Pega aquí el mensaje"></textarea>'
   +'<label>Teléfono del comprador</label><input id="ph" placeholder="09XXXXXXXX" inputmode="tel"><div id="newErr" class="err"></div>'
   +'<div class="actions"><button class="b p" data-act="add">Leer y guardar pedido</button></div></div>';
}
function viewReport(c){
  var days=Number(S.days),since=Date.now()-days*86400000;
  var list=ordersOf(c.id).filter(function(o){return days===0||o.created>=since});
  var s=C.summarize(list.map(function(o){return Object.assign({},o,{history:historyFor(o)})}));
  var h='<div class="card"><div class="row"><div class="grow"><b>Reporte de '+esc(c.store)+'</b></div><select data-act="days" style="width:auto"><option value="7"'+(days===7?' selected':'')+'>Últimos 7 días</option><option value="30"'+(days===30?' selected':'')+'>Últimos 30 días</option><option value="0"'+(days===0?' selected':'')+'>Todo</option></select></div></div>'
   +'<div class="kpis">'+kpi(s.total,'Pedidos')+kpi(pct(s.tasaConfirmacion),'Confirmados')+kpi(s.entregados,'Entregados')+kpi(s.devueltos,'Devueltos')+kpi(pct(s.tasaEntrega),'Tasa de entrega')+kpi(C.money(s.ventas),'Vendido (entregado)')+kpi(s.riesgoAlto,'Compradores de riesgo alto')+'</div>';
  var txt='📊 Resumen de '+c.store+' ('+(days?'últimos '+days+' días':'todo el historial')+')\n• Pedidos: '+s.total+'\n• Confirmados: '+s.confirmados+' ('+pct(s.tasaConfirmacion)+')\n• Entregados: '+s.entregados+'\n• Devueltos: '+s.devueltos+'\n• Tasa de entrega: '+pct(s.tasaEntrega)+'\n• Vendido: '+C.money(s.ventas)+'\n• Compradores de riesgo alto: '+s.riesgoAlto;
  return h+'<div class="card"><h2>Resumen para copiar</h2><textarea readonly id="rep">'+esc(txt)+'</textarea><div class="actions"><button class="b p" data-act="copyrep">Copiar</button></div></div>';
}
function kpi(v,l){return '<div class="kpi"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'}
var TPL_NAMES={confirmar:'Confirmar pedido',recordatorio:'Recordatorio',adelanto:'Pedir adelanto del envío',enviado:'Pedido enviado',entrega:'Aviso de entrega',carrito:'Carrito abandonado'};
function viewTemplates(c){
  var h='<div class="card"><h2>Mis mensajes</h2><div class="mute">Puedes usar: {nombre} {tienda} {producto} {total} {direccion} {ciudad} {guia} {adelanto} {enlace}</div><label>Adelanto de envío ($)</label><input type="number" step="0.5" min="0" data-act="advance" value="'+esc(c.advance)+'" style="max-width:140px"></div>';
  Object.keys(TPL_NAMES).forEach(function(k){h+='<div class="card"><label>'+TPL_NAMES[k]+'</label><textarea data-act="tpl" data-k="'+k+'">'+esc(tplOf(c,k))+'</textarea><div class="actions"><button class="b" data-act="tplreset" data-k="'+k+'">Restaurar</button></div></div>'});
  return h;
}

/* ===== ADMINISTRADOR ===== */
function paidThisMonth(cid){var p=S.payments.find(function(x){return x.client_id===cid&&x.month===monthKey()});return !!(p&&p.paid)}
function renderAdmin(){
  var tab=S.tab.admin;
  nav([['resumen','Resumen'],['clientes','Clientes y cobros'],['nuevo','Agregar cliente']],tab,'admin');
  var rows=S.clients.map(function(c){
    var s=C.summarize(ordersOf(c.id).map(function(o){return Object.assign({},o,{history:historyFor(o)})}));
    return {c:c,s:s,pend:ordersOf(c.id).filter(function(o){return o.status==='por_confirmar'}).length};
  });
  var h='';
  if(tab==='resumen'){
    var activos=rows.filter(function(r){return r.c.subStatus==='active'}).length;
    var mrr=rows.filter(function(r){return r.c.subStatus==='active'}).reduce(function(a,r){return a+r.c.price},0);
    var manual=S.payments.filter(function(p){return p.month===monthKey()&&p.paid}).reduce(function(a,p){return a+Number(p.amount)},0);
    h='<div class="kpis">'+kpi(S.clients.length,'Clientes')+kpi(activos,'Pagando')+kpi(C.money(mrr),'Ingreso mensual (Whop)')+kpi(C.money(manual),'Pagos manuales este mes')+'</div>'
     +'<div class="card"><h2>Qué hace cada cliente</h2><div style="overflow:auto"><table><tr><th>Cliente</th><th>Estado</th><th>Pedidos</th><th>Pendientes</th><th>Entrega</th><th>Devol.</th></tr>'
     +rows.map(function(r){return '<tr><td><b>'+esc(r.c.name)+'</b><div class="mute">'+esc(r.c.store)+'</div></td><td><span class="badge s-'+r.c.subStatus+'">'+esc(statusLabelSub(r.c.subStatus))+'</span></td><td>'+r.s.total+'</td><td>'+(r.pend?'<span class="badge s-por_confirmar">'+r.pend+'</span>':'0')+'</td><td>'+pct(r.s.tasaEntrega)+'</td><td>'+r.s.devueltos+'</td></tr>'}).join('')
     +'</table></div><div class="mute" style="margin-top:8px">Muchos pendientes y pocos confirmados: ese cliente quizás no está usando el panel.</div></div>';
  }else if(tab==='clientes'){
    h=rows.map(function(r){var c=r.c;
      return '<div class="card"><div class="row"><div class="grow"><b>'+esc(c.name)+'</b> · '+esc(c.store)+'<div class="mute">'+esc(c.email||'sin correo')+(c.periodEnd?' · renueva '+new Date(c.periodEnd).toLocaleDateString('es-EC'):'')+'</div></div><span class="badge s-'+c.subStatus+'">'+esc(statusLabelSub(c.subStatus))+'</span></div>'
       +'<div class="actions"><button class="b" data-act="viewas" data-id="'+c.id+'">Ver su panel</button>'
       +'<button class="b" data-act="setsub" data-id="'+c.id+'" data-s="cortesia">Cortesía</button><button class="b" data-act="setsub" data-id="'+c.id+'" data-s="canceled">Suspender</button>'
       +'<button class="b" data-act="paid" data-id="'+c.id+'">'+(paidThisMonth(c.id)?'Quitar pago manual':'Marcar pago manual')+'</button></div>'
       +'<details style="margin-top:10px"'+(S.adminInfo&&S.adminInfo.id===c.id?' open':'')+'><summary class="mute">Acceso y Shopify</summary><div class="actions"><button class="b" data-act="link" data-id="'+c.id+'">Generar enlace de acceso</button><button class="b" data-act="hook" data-id="'+c.id+'">Datos del webhook de Shopify</button></div><div id="info-'+c.id+'">'+(S.adminInfo&&S.adminInfo.id===c.id?S.adminInfo.html:'')+'</div></details>'
       +'<div class="row" style="margin-top:8px"><span class="mute">Mensualidad $</span><input type="number" style="width:90px" data-act="price" data-id="'+c.id+'" value="'+esc(c.price)+'"></div></div>';
    }).join('')||'<div class="card mute">Aún no hay clientes.</div>';
  }else{
    h='<div class="card"><h2>Agregar cliente a mano</h2><div class="mute">Para tus clientes de la agencia (cuenta cortesía) o pruebas. Quien paga por Whop se crea solo.</div>'
     +'<label>Nombre</label><input id="nc_name"><label>Nombre de su tienda</label><input id="nc_store"><label>Correo de la tienda (el mismo de Shopify y Dropi)</label><input id="nc_email" type="email">'
     +'<label>Mensualidad ($)</label><input id="nc_price" type="number" value="0"><label>Tipo</label><select id="nc_status"><option value="cortesia">Cortesía (sin cobro)</option><option value="pendiente">Pendiente de pago</option></select>'
     +'<div id="ncErr" class="err"></div><div class="actions"><button class="b p" data-act="addclient">Crear cliente</button></div><div id="ncOut">'+(S.created||'')+'</div></div>'
     +(DEMO?'<div class="card"><h2>Datos de demostración</h2><div class="actions"><button class="b d" data-act="reset">Reiniciar demostración</button></div></div>':'');
  }
  $('#view').innerHTML=h;
}
function infoBox(label,value){return '<label>'+esc(label)+'</label><input readonly value="'+esc(value)+'" onclick="this.select()">'}

/* ---------- Acciones ---------- */
async function run(fn){
  try{await fn()}catch(e){toast(e.message||'Algo salió mal. Intenta de nuevo.');try{await api.load()}catch(x){}}
  render();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t||t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')return;
  var a=t.dataset.act,id=t.dataset.id,o=id&&S.orders.find(function(x){return x.id===id}),c=currentClient();
  if(a==='tab'){S.tab[t.dataset.scope]=t.dataset.tab;S.created='';S.adminInfo=null;render()}
  else if(a==='filter'){S.filter=t.dataset.f;render()}
  else if(a==='logout'){run(async function(){await api.logout();S.session=null;S.isAdmin=false;S.viewAs=null})}
  else if(a==='login'){run(async function(){var em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)throw new Error('Escribe tu correo y contraseña');await api.login(em,pw);await api.load()})}
  else if(a==='setpw'){var p1=$('#pw1').value,p2=$('#pw2').value;
    if(p1.length<8){$('#authErr').textContent='Mínimo 8 caracteres.';return}if(p1!==p2){$('#authErr').textContent='Las contraseñas no coinciden.';return}
    run(async function(){await api.setPassword(p1);S.authView='login';history.replaceState(null,'',location.pathname);await api.load();toast('Contraseña guardada')})}
  else if(a==='status'&&o){var prev=o.status;o.status=t.dataset.s;run(async function(){try{await api.updateOrder(id,{status:o.status})}catch(e){o.status=prev;throw e}})}
  else if(a==='wa'&&o){if(t.dataset.k==='adelanto'&&!o.advanceAsked){o.advanceAsked=true;api.updateOrder(id,{advanceAsked:true}).catch(function(){})}}
  else if(a==='cartwa'){var k=S.checkouts.find(function(x){return x.id===id});if(k&&k.status==='abierto'){k.status='contactado';api.setCheckout(id,'contactado').catch(function(){});setTimeout(render,300)}}
  else if(a==='cart'){run(async function(){await api.setCheckout(id,t.dataset.s);S.checkouts=S.checkouts.filter(function(x){return x.id!==id})})}
  else if(a==='add'&&c){
    var r=C.parseOrderMessage($('#msg').value),ph=$('#ph').value,err=$('#newErr');
    if(!r.ok){err.textContent='No pude leer: '+r.missing.join(', ')+'. Revisa que pegaste el mensaje completo.';return}
    if(!C.validEcPhone(ph)){err.textContent='Escribe el teléfono del comprador (ej. 0991234567).';return}
    run(async function(){await api.addOrder(c.id,r.data,ph.trim());await api.load();S.tab.client='pedidos';S.filter='por_confirmar'});
  }
  else if(a==='copyrep'){var ta=$('#rep');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){t.textContent='¡Copiado!'},function(){t.textContent='Selecciona y copia (Ctrl+C)'})}catch(x){t.textContent='Selecciona y copia (Ctrl+C)'}}
  else if(a==='tplreset'&&c){delete c.templates[t.dataset.k];run(async function(){await api.saveSettings(c)})}
  else if(a==='viewas'){S.viewAs=id;S.tab.client='pedidos';render()}
  else if(a==='setsub'){var cc=client(id);if(!confirm('¿Cambiar el estado de '+cc.name+' a '+statusLabelSub(t.dataset.s)+'?'))return;run(async function(){await api.setSubStatus(id,t.dataset.s);cc.subStatus=t.dataset.s})}
  else if(a==='paid'){var cl=client(id),mk=monthKey(),np=!paidThisMonth(id);run(async function(){await api.setPaid(id,mk,np,cl.price);var p=S.payments.find(function(x){return x.client_id===id&&x.month===mk});if(p){p.paid=np}else S.payments.push({client_id:id,month:mk,paid:np,amount:cl.price})})}
  else if(a==='link'){run(async function(){var r=await api.admin({action:'recovery_link',client_id:id});var box=$('#info-'+id);if(!box)return;S.adminInfo={id:id,html:r.link?infoBox('Enlace para crear/cambiar contraseña (envíaselo por WhatsApp; caduca en 1 hora)',r.link):'<div class="err">No se pudo generar.</div>'}})}
  else if(a==='hook'){run(async function(){var r=await api.admin({action:'hook',client_id:id});
    S.adminInfo={id:id,html:infoBox('Dirección (URL) del webhook',r.webhook_url)+'<div class="mute" style="margin:6px 0">En Shopify: Configuración → Notificaciones → Webhooks. Crea 4: Creación de pedido, Actualización de pedido, Creación de checkout y Actualización de checkout; formato JSON; esta misma URL. Shopify te muestra una clave de firma: pégala aquí abajo. Estado de la clave: <b>'+(r.has_secret?'guardada':'falta')+'</b>.</div>'
      +'<label>Clave de firma de Shopify</label><input id="sec-'+esc(id)+'" type="password" autocomplete="off"><div class="actions"><button class="b p" data-act="savesec" data-id="'+esc(id)+'">Guardar clave</button></div>'}})}
  else if(a==='savesec'){var v=$('#sec-'+id).value;run(async function(){await api.admin({action:'set_secret',client_id:id,secret:v});S.adminInfo=null;toast('Clave guardada')})}
  else if(a==='addclient'){
    var b={action:'create',name:$('#nc_name').value.trim(),store:$('#nc_store').value.trim(),email:$('#nc_email').value.trim(),price:Number($('#nc_price').value)||0,status:$('#nc_status').value};
    if(!b.name||!b.store||!b.email){$('#ncErr').textContent='Faltan datos.';return}
    run(async function(){var r=await api.admin(b);await api.load();
      S.created='<div class="alert info"><b>Cliente creado: '+esc(b.name)+'.</b> Envíale este enlace por WhatsApp para que cree su contraseña (caduca en 1 hora). Solo a esa persona.</div>'+infoBox('Enlace de acceso',r.link||'(no se pudo generar; usa «Generar enlace de acceso» en Clientes)')+infoBox('Webhook de Shopify de su tienda',r.webhook_url||'')});
  }
  else if(a==='reset'&&api.reset){if(confirm('¿Borrar todo y volver a los ejemplos?'))api.reset()}
});
document.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;
  if(t.id==='whoSel'){S.viewAs=t.value||null;render();return}
  if(!a)return;
  var id=t.dataset.id,o=id&&S.orders.find(function(x){return x.id===id}),c=currentClient();
  if(a==='guide'&&o){o.guide=t.value.trim();run(async function(){await api.updateOrder(id,{guide:o.guide})})}
  else if(a==='phone'&&o){o.phone=t.value.trim();run(async function(){await api.updateOrder(id,{phone:o.phone})})}
  else if(a==='hist'&&o){o.history=o.history||{};o.history[t.dataset.w]=Math.max(0,parseInt(t.value,10)||0);run(async function(){await api.updateOrder(id,{history:o.history})})}
  else if(a==='days'){S.days=Number(t.value);render()}
  else if(a==='advance'&&c){c.advance=Math.max(0,Number(t.value)||0);run(async function(){await api.saveSettings(c)})}
  else if(a==='tpl'&&c){c.templates=c.templates||{};c.templates[t.dataset.k]=t.value;run(async function(){await api.saveSettings(c)})}
  else if(a==='price'){var cl=client(id);cl.price=Math.max(0,Number(t.value)||0);run(async function(){await api.setPrice(id,cl.price)})}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&S.session===null&&e.target&&(e.target.id==='pw'||e.target.id==='em')){var b=document.querySelector('[data-act=login]');if(b)b.click()}
});

/* ---------- Arranque ---------- */
async function boot(){
  api=DEMO?demoApi():realApi();
  if(!DEMO){
    api.onAuth(function(ev){
      if(ev==='PASSWORD_RECOVERY'){S.authView='recovery';S.session=S.session||{};api.load().then(render)}
      else if(ev==='SIGNED_OUT'){S.session=null;S.isAdmin=false;render()}
    });
    if(/type=recovery/.test(location.hash))S.authView='recovery';
  }
  try{await api.load()}catch(e){toast('No se pudo cargar. Revisa tu conexión.')}
  S.loading=false;render();
  // refresco automático cada 30 s si el usuario no está escribiendo
  if(!DEMO)setInterval(function(){
    var ae=document.activeElement;
    if(document.hidden||S.authView==='recovery'||!S.session||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))return;
    api.load().then(render).catch(function(){});
  },30000);
}
boot();
})();
</script>
</body>
